<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tutores e Alunos com Card A4</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .table-container {
            max-height: calc(100vh - 260px);
            overflow-y: auto;
        }
        .table-container thead th {
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: #f8fafc;
        }
        
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .page-a4 {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            max-height: 297mm;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 5mm 5mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body * {
                visibility: hidden !important;
            }
            #viewA4, #viewA4 * {
                visibility: visible !important;
            }
            #viewA4 {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: block !important;
                overflow: visible !important;
            }
            .page-a4 {
                position: relative !important;
                page-break-after: always;
                width: 210mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                box-shadow: none !important;
                margin: 0 auto !important;
                padding: 5mm 5mm !important;
                border: none !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
            }
            .page-a4:last-child {
                page-break-after: auto;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-indigo-600 text-white shadow-md flex-shrink-0 no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-700 p-2 rounded-xl shadow-inner"></div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">Dados Tutores, Atividades e Card A4</h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex bg-indigo-800 p-1 rounded-xl text-xs font-semibold">
                    <button onclick="switchTab('dashboard')" id="btnTabDashboard" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow transition cursor-pointer">Planilha </button>
                    <button onclick="switchTab('a4')" id="btnTabA4" class="px-3 py-1.5 rounded-lg text-indigo-200 hover:text-white transition cursor-pointer">Visualizar Card A4</button>
                </div>
                <button onclick="refreshData()" class="bg-indigo-900 hover:bg-indigo-950 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-rotate"></i> Atualizar
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-4 flex flex-col overflow-hidden">
        
        <!-- ABA 1: TABELA PRINCIPAL DINÂMICA -->
        <div id="viewDashboard" class="flex flex-col flex-grow overflow-hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col flex-grow overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4 flex-shrink-0">
                    <div class="flex items-center gap-2">
                        <h3 class="font-bold text-slate-900">Planilha Completa de Tutores </h3>
                        <span id="stat-total-tutores" class="bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full text-xs font-semibold">0 registros</span>
                    </div>
                    
                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <div class="relative flex-grow sm:w-64">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-slate-400 text-xs"></i>
                            <input type="text" id="globalSearchInput" oninput="filterTable()" placeholder="Buscar globalmente..." class="w-full pl-9 pr-4 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <div class="table-container overflow-x-auto flex-grow relative">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr id="tableHeaderRow" class="bg-slate-50 text-slate-500 border-b border-slate-200 uppercase font-semibold shadow-sm">
                            </tr>
                        </thead>
                        <tbody id="dataTableBody" class="divide-y divide-slate-100 text-slate-700">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ABA 2: CARD A4 -->
        <div id="viewA4" class="hidden flex-col flex-grow overflow-y-auto items-center pb-8">
            <div class="mb-4 mt-2 flex justify-between w-full max-w-[210mm] no-print items-center">
                <span class="text-xs text-slate-500 font-medium">Pré-visualização do Relatório A4</span>
                <button onclick="window.print()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-print"></i> Imprimir / Salvar PDF
                </button>
            </div>

            <!-- Contêiner dinâmico para as páginas A4 -->
            <div id="a4PagesContainer" class="w-full flex flex-col items-center gap-8"></div>
        </div>

    </main>

    <!-- Toast de Notificação -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl text-xs shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Dados atualizados com sucesso!</span>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycbzbSe8OY2Do4ZA3BOo3lst03S8lHiupSYVKCjoFRgggoTbGUDakcKFnmz2O6fGY1CXuBQ/exec";
        let tableHeaders = [];
        let tableData = [];
        let activeDropdown = null;
        let columnFiltersState = {};

        window.onload = function() {
            fetchDataFromAppsScript();

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.filter-dropdown-container')) {
                    closeAllDropdowns();
                }
            });

            setInterval(() => {
                fetchDataFromAppsScript(true);
            }, 30000);
        };

        function switchTab(tab) {
            const viewDash = document.getElementById('viewDashboard');
            const viewA4 = document.getElementById('viewA4');
            const btnDash = document.getElementById('btnTabDashboard');
            const btnA4 = document.getElementById('btnTabA4');

            if (tab === 'dashboard') {
                viewDash.classList.remove('hidden');
                viewDash.classList.add('flex');
                viewA4.classList.add('hidden');
                viewA4.classList.remove('flex');
                btnDash.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow transition cursor-pointer";
                btnA4.className = "px-3 py-1.5 rounded-lg text-indigo-200 hover:text-white transition cursor-pointer";
            } else {
                viewA4.classList.remove('hidden');
                viewA4.classList.add('flex');
                viewDash.classList.add('hidden');
                viewDash.classList.remove('flex');
                btnA4.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow transition cursor-pointer";
                btnDash.className = "px-3 py-1.5 rounded-lg text-indigo-200 hover:text-white transition cursor-pointer";
                renderA4Content();
            }
        }

        async function fetchDataFromAppsScript(isBackground = false) {
            try {
                if(!isBackground) showToast("Buscando dados da planilha...");
                
                const response = await fetch(scriptUrl);
                if (!response.ok) throw new Error("Erro na requisição ao Apps Script");
                
                const result = await response.json();
                
                if (result.error) throw new Error(result.error);

                if (result.headers && result.data) {
                    tableHeaders = result.headers;
                    tableData = result.data;
                    renderDashboard();
                    if(!isBackground) showToast("Dados sincronizados com sucesso!");
                }
            } catch (error) {
                console.warn("Erro ao buscar dados:", error);
                if(!isBackground) showToast("Erro ao conectar com a planilha.", true);
            }
        }

        function renderDashboard() {
            document.getElementById('stat-total-tutores').innerText = `${tableData.length} registros`;
            renderTableHeaders();
            renderTable(tableData);
            renderA4Content();
        }

        function formatPhoneNumber(value) {
            const numbers = String(value).replace(/\D/g, '');
            if (numbers.length === 11) return `(${numbers.slice(0, 2)}) ${numbers.slice(2, 7)}-${numbers.slice(7, 11)}`;
            else if (numbers.length === 10) return `(${numbers.slice(0, 2)}) ${numbers.slice(2, 6)}-${numbers.slice(6, 10)}`;
            else if (numbers.length === 13 && numbers.startsWith('55')) return `+${numbers.slice(0, 2)} (${numbers.slice(2, 4)}) ${numbers.slice(4, 9)}-${numbers.slice(9, 13)}`;
            return value;
        }

        function getConditionalColorStyle(percentVal) {
            if (percentVal <= 33) return "background-color: #fee2e2; color: #991b1b; font-weight: 600;";
            else if (percentVal <= 50) return "background-color: #ffedd5; color: #9a3412; font-weight: 600;";
            else if (percentVal <= 75) return "background-color: #fef08a; color: #854d0e; font-weight: 600;";
            else return "background-color: #dcfce7; color: #166534; font-weight: 600;";
        }

        function isNumericColumn(headerName) {
            const sampleValues = tableData.slice(0, 10).map(row => String(row[headerName] || "").trim());
            const numericCount = sampleValues.filter(val => val !== "" && !isNaN(Number(val))).length;
            return numericCount > 0 && numericCount >= sampleValues.filter(v => v !== "").length / 2;
        }

        function renderTableHeaders() {
            const headerRow = document.getElementById('tableHeaderRow');
            headerRow.innerHTML = '';

            tableHeaders.forEach((header, index) => {
                const th = document.createElement('th');
                let alignClass = isNumericColumn(header) ? " text-center" : "";
                th.className = `py-2.5 px-3 whitespace-nowrap relative filter-dropdown-container bg-slate-50${alignClass}`;
                
                const uniqueValues = [...new Set(tableData.map(row => String(row[header] !== undefined && row[header] !== null ? row[header] : "").trim()))].filter(v => v !== "").sort();
                const currentFilter = columnFiltersState[header] || "";

                th.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="truncate">${header}</span>
                        <button onclick="toggleFilterDropdown(event, ${index})" class="text-slate-400 hover:text-indigo-600 p-1 rounded transition cursor-pointer ${currentFilter ? 'text-indigo-600 bg-indigo-50' : ''}" title="Filtrar coluna">
                            <i class="fa-solid fa-filter text-[10px]"></i>
                        </button>
                    </div>
                    <div id="dropdown-${index}" class="hidden absolute left-0 top-full mt-1 bg-white border border-slate-200 shadow-xl rounded-xl p-3 z-50 w-56 text-slate-700 normal-case font-normal">
                        <div class="text-[11px] font-semibold text-slate-500 mb-2 pb-1 border-b border-slate-100 flex justify-between items-center">
                            <span>Filtrar: ${header}</span>
                            ${currentFilter ? `<button onclick="clearColumnFilter('${header}')" class="text-indigo-600 hover:underline text-[10px]">Limpar</button>` : ''}
                        </div>
                        <div class="max-h-48 overflow-y-auto space-y-1 text-xs">
                            <label class="flex items-center gap-2 p-1 hover:bg-slate-50 rounded cursor-pointer">
                                <input type="radio" name="filter-${index}" value="" ${currentFilter === "" ? "checked" : ""} onchange="applyColumnFilter('${header}', '')" class="text-indigo-600 focus:ring-indigo-500">
                                <span class="text-slate-500 italic">(Selecionar todos)</span>
                            </label>
                            ${uniqueValues.map(val => `
                                <label class="flex items-center gap-2 p-1 hover:bg-slate-50 rounded cursor-pointer truncate">
                                    <input type="radio" name="filter-${index}" value="${val}" ${currentFilter === val ? "checked" : ""} onchange="applyColumnFilter('${header}', '${val.replace(/'/g, "\\'")}')" class="text-indigo-600 focus:ring-indigo-500">
                                    <span class="truncate" title="${val}">${val}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
                headerRow.appendChild(th);
            });
        }

        function toggleFilterDropdown(event, index) {
            event.stopPropagation();
            const dropdown = document.getElementById(`dropdown-${index}`);
            const isOpen = !dropdown.classList.contains('hidden');
            closeAllDropdowns();
            if (!isOpen) {
                dropdown.classList.remove('hidden');
                activeDropdown = dropdown;
            }
        }

        function closeAllDropdowns() {
            document.querySelectorAll('[id^="dropdown-"]').forEach(el => el.classList.add('hidden'));
            activeDropdown = null;
        }

        function applyColumnFilter(header, value) {
            if (value === "") delete columnFiltersState[header];
            else columnFiltersState[header] = value;
            closeAllDropdowns();
            filterTable();
            renderTableHeaders();
        }

        function clearColumnFilter(header) {
            delete columnFiltersState[header];
            closeAllDropdowns();
            filterTable();
            renderTableHeaders();
        }

        function renderTable(data) {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${tableHeaders.length || 1}" class="p-6 text-center text-slate-400">Nenhum dado encontrado.</td></tr>`;
                return;
            }

            data.forEach(rowObj => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/50 transition";
                
                tableHeaders.forEach((header) => {
                    const td = document.createElement('td');
                    let tdAlignClass = isNumericColumn(header) ? " text-center" : "";
                    td.className = `py-2.5 px-3 whitespace-nowrap text-slate-700${tdAlignClass}`;
                    
                    let cellValue = rowObj[header] !== undefined && rowObj[header] !== null ? String(rowObj[header]) : "";
                    const normalizedHeader = header.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    
                    const isPhoneCol = normalizedHeader.includes("telefone") || normalizedHeader.includes("celular") || normalizedHeader.includes("whatsapp") || normalizedHeader.includes("fone");
                    const isTrilhaCol = normalizedHeader.includes("produto") && normalizedHeader.includes("trilha");
                    const isPercentageCol = normalizedHeader.includes("media") || normalizedHeader.includes("porcentagem") || normalizedHeader.includes("%") || (!isNaN(Number(cellValue)) && Number(cellValue) <= 1 && Number(cellValue) >= 0 && cellValue.includes("."));

                    if (isPhoneCol && cellValue.trim() !== "") {
                        td.innerText = formatPhoneNumber(cellValue);
                    } else if (isPercentageCol && cellValue.trim() !== "") {
                        let num = Number(cellValue);
                        if (!isNaN(num)) {
                            let percentVal = num <= 1 ? num * 100 : num;
                            let formattedPercent = percentVal.toFixed(2).replace('.', ',') + '%';
                            let styleAttr = getConditionalColorStyle(percentVal);
                            td.innerHTML = `<span style="${styleAttr} padding: 4px 8px; border-radius: 4px; display: inline-block; text-align: center; min-width: 75px;">${formattedPercent}</span>`;
                        } else td.innerText = cellValue;
                    } else if (isTrilhaCol) {
                        const valLower = cellValue.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                        let badgeClass = "";
                        if (valLower === "entregue") badgeClass = "bg-emerald-600 text-white px-2.5 py-1 rounded-md font-medium text-[11px] inline-block";
                        else if (valLower === "nao entregue") badgeClass = "bg-amber-400 text-slate-900 px-2.5 py-1 rounded-md font-medium text-[11px] inline-block";
                        else if (valLower === "nao disponivel" || valLower === "nao se aplica" || valLower === "-") badgeClass = "bg-slate-500 text-white px-2.5 py-1 rounded-md font-medium text-[11px] inline-block";

                        if (badgeClass) td.innerHTML = `<span class="${badgeClass}">${valLower === "nao disponivel" || valLower === "nao se aplica" ? "-" : cellValue}</span>`;
                        else td.innerText = cellValue;
                    } else td.innerText = cellValue;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        function abreviarPrimeiroEUltimoNome(nomeCompleto) {
            if (!nomeCompleto) return "";
            const partes = nomeCompleto.trim().split(/\s+/);
            if (partes.length <= 1) return nomeCompleto;
            return `${partes[0]} ${partes[partes.length - 1]}`;
        }

        function formatarStatusSimNao(valor) {
            if (valor === undefined || valor === null || String(valor).trim() === "") return `<span class="text-slate-400 font-bold">-</span>`;
            
            const valNorm = String(valor).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            
            if (valNorm === "nao disponivel" || valNorm === "nao se aplica" || valNorm === "-") {
                return `<span class="text-slate-400 font-bold">-</span>`;
            }
            if (valNorm.includes("entregue") && !valNorm.includes("nao")) return "Sim";
            if (valNorm.includes("nao entregue")) return "Não";
            
            if (valNorm === "sim") return "Sim";
            if (valNorm === "nao") return "Não";
            
            return `<span class="text-slate-400 font-bold">-</span>`;
        }

        function formatarPercentualCardA4(valor) {
            if (valor === undefined || valor === null || String(valor).trim() === "") return `<span class="text-slate-400 font-bold">-</span>`;
            
            const valNorm = String(valor).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            if (valNorm === "nao disponivel" || valNorm === "nao se aplica" || valNorm === "-") {
                return `<span class="text-slate-400 font-bold">-</span>`;
            }

            let rawStr = String(valor).trim().replace(',', '.');
            let num = Number(rawStr);
            if (isNaN(num)) return `<span class="text-slate-400 font-bold">-</span>`;

            let percentVal = num <= 1 ? num * 100 : num;
            let formattedPercent = percentVal.toFixed(1).replace('.', ',') + '%';
            let styleAttr = getConditionalColorStyle(percentVal);

            return `<span style="${styleAttr} padding: 1.5px 2px; border-radius: 2px; display: inline-block; text-align: center; font-size: 7.5px; line-height: 1;">${formattedPercent}</span>`;
        }

        function getColHeader(possibleNames, fallbackIndex) {
            for (let name of possibleNames) {
                let idx = tableHeaders.findIndex(h => h && h.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(name));
                if (idx !== -1) return tableHeaders[idx];
            }
            return tableHeaders[fallbackIndex] || "";
        }

        // Função para checar se a trilha possui algum dado útil para ser exibida
        function isTrackActive(headerA, headerC) {
            if (!headerA && !headerC) return false;
            return tableData.some(row => {
                let valA = String(row[headerA] || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                let valC = String(row[headerC] || "").trim();
                
                let aValid = valA !== "" && valA !== "-" && valA !== "nao disponivel" && valA !== "nao se aplica";
                let cValid = valC !== "" && valC !== "-";
                
                return aValid || cValid;
            });
        }

        function renderA4Content() {
            const container = document.getElementById('a4PagesContainer');
            container.innerHTML = '';

            const half = Math.ceil(tableData.length / 2);
            const dataCol1 = tableData.slice(0, half);
            const dataCol2 = tableData.slice(half);

            const hName = tableHeaders[0] || "";
            
            const hT1_A = getColHeader(["a. t 1", "atividade tutor 1", "trilha 1"], 7);
            const hT2_A = getColHeader(["a. t 2", "atividade tutor 2", "trilha 2"], 8);
            const hT3_A = getColHeader(["a. t 3", "atividade tutor 3", "trilha 3"], 9);
            const hT4_A = getColHeader(["a. t 4", "atividade tutor 4", "trilha 4"], 10);
            const hT5_A = getColHeader(["a. t 5", "atividade tutor 5", "trilha 5"], 11);
            const hT6_A = getColHeader(["a. t 6", "atividade tutor 6", "trilha 6"], 12);

            const hT1_C = getColHeader(["%c / t1", "%c t1", "% cursista 1", "media 1"], 14);
            const hT2_C = getColHeader(["%c / t2", "%c t2", "% cursista 2", "media 2"], 16);
            const hT3_C = getColHeader(["%c / t3", "%c t3", "% cursista 3", "media 3"], 18);
            const hT4_C = getColHeader(["%c / t4", "%c t4", "% cursista 4", "media 4"], 20);
            const hT5_C = getColHeader(["%c / t5", "%c t5", "% cursista 5", "media 5"], 22);
            const hT6_C = getColHeader(["%c / t6", "%c t6", "% cursista 6", "media 6"], 24);

            // Variáveis de controle para exibir ou ocultar trilhas com base no conteúdo
            const showT1 = isTrackActive(hT1_A, hT1_C);
            const showT2 = isTrackActive(hT2_A, hT2_C);
            const showT3 = isTrackActive(hT3_A, hT3_C);
            const showT4 = isTrackActive(hT4_A, hT4_C);
            const showT5 = isTrackActive(hT5_A, hT5_C);
            const showT6 = isTrackActive(hT6_A, hT6_C);

            const countSim = (header) => tableData.reduce((acc, rowObj) => {
                const raw = String(rowObj[header] || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                if (raw.includes("entregue") && !raw.includes("nao")) return acc + 1;
                if (raw === "sim") return acc + 1;
                return acc;
            }, 0);

            const totalSimT1 = showT1 ? countSim(hT1_A) : 0;
            const totalSimT2 = showT2 ? countSim(hT2_A) : 0;
            const totalSimT3 = showT3 ? countSim(hT3_A) : 0;
            const totalSimT4 = showT4 ? countSim(hT4_A) : 0;
            const totalSimT5 = showT5 ? countSim(hT5_A) : 0;
            const totalSimT6 = showT6 ? countSim(hT6_A) : 0;

            function generateRowsHtml(dataSubset, startIndex) {
                let html = '';
                dataSubset.forEach((rowObj, index) => {
                    const globalIndex = startIndex + index + 1;
                    const rawName = String(rowObj[hName] || "Registro");
                    const nameVal = abreviarPrimeiroEUltimoNome(rawName);
                    
                    const at1 = formatarStatusSimNao(rowObj[hT1_A]);
                    const pcT1 = formatarPercentualCardA4(rowObj[hT1_C]);
                    const at2 = formatarStatusSimNao(rowObj[hT2_A]);
                    const pcT2 = formatarPercentualCardA4(rowObj[hT2_C]);
                    const at3 = formatarStatusSimNao(rowObj[hT3_A]);
                    const pcT3 = formatarPercentualCardA4(rowObj[hT3_C]);
                    const at4 = formatarStatusSimNao(rowObj[hT4_A]);
                    const pcT4 = formatarPercentualCardA4(rowObj[hT4_C]);
                    const at5 = formatarStatusSimNao(rowObj[hT5_A]);
                    const pcT5 = formatarPercentualCardA4(rowObj[hT5_C]);
                    const at6 = formatarStatusSimNao(rowObj[hT6_A]);
                    const pcT6 = formatarPercentualCardA4(rowObj[hT6_C]);

                    const bgClass = index % 2 === 0 ? "bg-white" : "bg-slate-50/60";

                    let rowContent = `
                        <td class="px-1 py-0.5 text-center font-mono text-[7.5px] text-slate-400 border-r border-slate-100">${globalIndex}</td>
                        <td class="px-1.5 py-0.5 font-medium text-slate-800 text-[8px] truncate max-w-[80px]" title="${rawName}">${nameVal}</td>
                    `;

                    if(showT1) rowContent += `<td class="px-0.5 py-0.5 text-[8px] text-center font-bold text-blue-900 bg-blue-50/50 border-l border-slate-100">${at1}</td><td class="px-0.5 py-0.5 text-center bg-blue-50/20 border-l border-slate-100">${pcT1}</td>`;
                    if(showT2) rowContent += `<td class="px-0.5 py-0.5 text-[8px] text-center font-bold text-emerald-900 bg-emerald-50/50 border-l border-slate-100">${at2}</td><td class="px-0.5 py-0.5 text-center bg-emerald-50/20 border-l border-slate-100">${pcT2}</td>`;
                    if(showT3) rowContent += `<td class="px-0.5 py-0.5 text-[8px] text-center font-bold text-purple-900 bg-purple-50/50 border-l border-slate-100">${at3}</td><td class="px-0.5 py-0.5 text-center bg-purple-50/20 border-l border-slate-100">${pcT3}</td>`;
                    if(showT4) rowContent += `<td class="px-0.5 py-0.5 text-[8px] text-center font-bold text-amber-900 bg-amber-50/50 border-l border-slate-100">${at4}</td><td class="px-0.5 py-0.5 text-center bg-amber-50/20 border-l border-slate-100">${pcT4}</td>`;
                    if(showT5) rowContent += `<td class="px-0.5 py-0.5 text-[8px] text-center font-bold text-rose-900 bg-rose-50/50 border-l border-slate-100">${at5}</td><td class="px-0.5 py-0.5 text-center bg-rose-50/20 border-l border-slate-100">${pcT5}</td>`;
                    if(showT6) rowContent += `<td class="px-0.5 py-0.5 text-[8px] text-center font-bold text-cyan-900 bg-cyan-50/50 border-l border-slate-100">${at6}</td><td class="px-0.5 py-0.5 text-center bg-cyan-50/20 border-l border-slate-100">${pcT6}</td>`;

                    html += `<tr class="${bgClass}">${rowContent}</tr>`;
                });
                return html;
            }

            // Geração Dinâmica da Legenda
            let legendItems = [];
            if(showT1) legendItems.push(`<div class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 bg-blue-100 border border-blue-400 rounded-sm"></span><span class="truncate"><strong>T1:</strong> Ativ. Tutor e % Cursista Trilha 1</span></div>`);
            if(showT2) legendItems.push(`<div class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 bg-emerald-100 border border-emerald-400 rounded-sm"></span><span class="truncate"><strong>T2:</strong> Ativ. Tutor e % Cursista Trilha 2</span></div>`);
            if(showT3) legendItems.push(`<div class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 bg-purple-100 border border-purple-400 rounded-sm"></span><span class="truncate"><strong>T3:</strong> Ativ. Tutor e % Cursista Trilha 3</span></div>`);
            if(showT4) legendItems.push(`<div class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 bg-amber-100 border border-amber-400 rounded-sm"></span><span class="truncate"><strong>T4:</strong> Ativ. Tutor e % Cursista Trilha 4</span></div>`);
            if(showT5) legendItems.push(`<div class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 bg-rose-100 border border-rose-400 rounded-sm"></span><span class="truncate"><strong>T5:</strong> Ativ. Tutor e % Cursista Trilha 5</span></div>`);
            if(showT6) legendItems.push(`<div class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 bg-cyan-100 border border-cyan-400 rounded-sm"></span><span class="truncate"><strong>T6:</strong> Ativ. Tutor e % Cursista Trilha 6</span></div>`);
            
            let legendHtml = legendItems.length > 0 ? `<div class="grid grid-cols-3 gap-x-2 gap-y-1 text-[7.5px] text-slate-700 bg-slate-50 p-1.5 rounded-lg border border-slate-200">${legendItems.join('')}</div>` : '';


            // Geração Dinâmica dos Contadores "Sim"
            let totalTutores = tableData.length; // Pega o total de tutores automaticamente
            let summaries = [];
            if(showT1) summaries.push(`<span class="text-blue-700 ml-1">T1: ${totalSimT1}/${totalTutores}</span>`);
            if(showT2) summaries.push(`<span class="text-emerald-700">T2: ${totalSimT2}/${totalTutores}</span>`);
            if(showT3) summaries.push(`<span class="text-purple-700">T3: ${totalSimT3}/${totalTutores}</span>`);
            if(showT4) summaries.push(`<span class="text-amber-700">T4: ${totalSimT4}/${totalTutores}</span>`);
            if(showT5) summaries.push(`<span class="text-rose-700">T5: ${totalSimT5}/${totalTutores}</span>`);
            if(showT6) summaries.push(`<span class="text-cyan-700">T6: ${totalSimT6}/${totalTutores}</span>`);
            let summaryText = summaries.length > 0 ? summaries.join(' | ') : '<span class="text-slate-400 font-normal ml-1">Sem dados de Atividade</span>';

            // Geração Dinâmica do Cabeçalho da Tabela
            let theadContent = `
                <th class="py-1 px-1 w-6 text-center">#</th>
                <th class="py-1 px-1.5 w-24">Tutor</th>
            `;
            if(showT1) theadContent += `<th class="py-1 px-0.5 text-center bg-blue-900 text-white w-7">A. T1</th><th class="py-1 px-0.5 text-center bg-blue-800 text-white w-9">%C T1</th>`;
            if(showT2) theadContent += `<th class="py-1 px-0.5 text-center bg-emerald-900 text-white w-7">A. T2</th><th class="py-1 px-0.5 text-center bg-emerald-800 text-white w-9">%C T2</th>`;
            if(showT3) theadContent += `<th class="py-1 px-0.5 text-center bg-purple-900 text-white w-7">A. T3</th><th class="py-1 px-0.5 text-center bg-purple-800 text-white w-9">%C T3</th>`;
            if(showT4) theadContent += `<th class="py-1 px-0.5 text-center bg-amber-900 text-white w-7">A. T4</th><th class="py-1 px-0.5 text-center bg-amber-800 text-white w-9">%C T4</th>`;
            if(showT5) theadContent += `<th class="py-1 px-0.5 text-center bg-rose-900 text-white w-7">A. T5</th><th class="py-1 px-0.5 text-center bg-rose-800 text-white w-9">%C T5</th>`;
            if(showT6) theadContent += `<th class="py-1 px-0.5 text-center bg-cyan-900 text-white w-7">A. T6</th><th class="py-1 px-0.5 text-center bg-cyan-800 text-white w-9">%C T6</th>`;


            function buildPageHtml(rowsHtml) {
                return `
                    <div class="page-a4 border border-slate-300 rounded-lg flex flex-col shrink-0">
                        
                        <div class="w-full flex flex-col flex-grow">
                            <div class="w-full mb-2 rounded-lg overflow-hidden border border-slate-200 shadow-sm shrink-0">
                                <img src="banner.jpg" alt="Banner do Curso" class="w-full h-auto block object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/800x150/0f172a/ffffff?text=Banner+Educacao+em+Direitos+Humanos';">
                            </div>

                            <div class="border-b-2 border-slate-800 pb-1 mb-2 flex justify-between items-baseline gap-2 shrink-0">
                                <h2 class="text-[14px] font-black text-slate-900 tracking-tight leading-tight whitespace-nowrap">
                                    Resultados Consolidados 
                                    <span class="text-[10px] font-normal text-slate-600 ml-1">(atualizado 13/10/2026 Tutores e 06/10/2026 Cursistas)</span>
                                </h2>
                                <div class="text-[10px] font-bold text-slate-800 text-right whitespace-nowrap">
                                    Atividades Entregues Tutores :
                                    ${summaryText}
                                </div>
                            </div>

                            <div class="flex-grow flex flex-col w-full">
                                <table class="w-full h-full text-left text-[8px] border-collapse">
                                    <thead>
                                        <tr class="bg-slate-800 text-white font-bold uppercase text-[7.5px] leading-tight h-[1%]">
                                            ${theadContent}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200 border-b border-slate-200">
                                        ${rowsHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        <div class="w-full shrink-0 mt-2 pt-2 border-t border-slate-300">
                            ${legendHtml}
                        </div>
                    </div>
                `;
            }

            if (dataCol1.length > 0) container.innerHTML += buildPageHtml(generateRowsHtml(dataCol1, 0));
            if (dataCol2.length > 0) container.innerHTML += buildPageHtml(generateRowsHtml(dataCol2, half));
        }

        function filterTable() {
            const globalQuery = document.getElementById('globalSearchInput').value.toLowerCase();
            const filtered = tableData.filter(rowObj => {
                let matchesGlobal = true;
                if (globalQuery) {
                    matchesGlobal = tableHeaders.some(header => {
                        let val = String(rowObj[header] || "").toLowerCase();
                        return val.includes(globalQuery);
                    });
                }
                if (!matchesGlobal) return false;

                for (let header in columnFiltersState) {
                    const filterVal = columnFiltersState[header].toLowerCase();
                    if (filterVal) {
                        let cellVal = String(rowObj[header] || "").toLowerCase().trim();
                        if (cellVal !== filterVal) return false;
                    }
                }
                return true;
            });
            renderTable(filtered);
        }

        function refreshData() {
            fetchDataFromAppsScript();
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            msgEl.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
